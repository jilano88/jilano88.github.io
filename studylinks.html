<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Guide Links</title>

<!-- Modern variable font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #0d1117;
        --card: #161b22;
        --text: #c9d1d9;
        --accent: #58a6ff;
        --accent-glow: rgba(88,166,255,0.4);
        --radius: 14px;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: var(--card);
        padding: 30px 40px;
        border-radius: var(--radius);
        box-shadow: 0 0 25px rgba(0,0,0,0.45);
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        font-size: clamp(28px, 5vw, 40px);
        color: var(--accent);
        font-weight: 600;
    }

    h2 {
        margin-top: 35px;
        font-size: 22px;
        color: #8b949e;
        border-bottom: 1px solid #21262d;
        padding-bottom: 6px;
        font-weight: 500;
    }

    /* Search bar */
    #searchBox {
        width: 100%;
        padding: 14px;
        margin-bottom: 25px;
        border-radius: var(--radius);
        border: none;
        background: #21262d;
        color: var(--text);
        font-size: 18px;
        outline: none;
        transition: box-shadow 0.2s;
    }

    #searchBox:focus {
        box-shadow: 0 0 10px var(--accent-glow);
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        margin: 10px 0;
        animation: fadeIn 0.4s ease;
    }

    a {
        text-decoration: none;
        font-size: 20px;
        color: var(--accent);
        padding: 10px 14px;
        display: inline-block;
        border-radius: var(--radius);
        transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    a:hover {
        background: #238636;
        color: white;
        transform: translateX(4px);
        box-shadow: 0 0 10px rgba(35,134,54,0.4);
    }

    .loading {
        color: #8b949e;
        font-style: italic;
        margin-top: 20px;
    }

    /* Responsive layout for Z Fold 8 */
    @media (max-width: 600px) {
        .container {
            padding: 20px;
        }
        a {
            font-size: 18px;
        }
    }

    @media (min-width: 1200px) {
        .container {
            max-width: 1100px;
        }
    }
</style>
</head>

<body>
    <div class="container">
        <h1>Study Guide Links</h1>

        <input id="searchBox" type="text" placeholder="Search guides, flashcards, topics…">

        <h2>Chapters</h2>
        <ul id="chapters"></ul>

        <h2>Non‑Chapter Study Guides</h2>
        <ul id="nonchapters"></ul>

        <h2>Flashcards</h2>
        <ul id="flashcards"></ul>

        <h2>Reading List</h2>
        <ul id="reading"></ul>

        <div class="loading" id="loading">Loading files…</div>
    </div>

<script>
async function loadFiles() {
    const apiUrl = "https://api.github.com/repos/jilano88/jilano88.github.io/contents/";

    const response = await fetch(apiUrl);
    const files = await response.json();

    const chapters = document.getElementById("chapters");
    const nonchapters = document.getElementById("nonchapters");
    const flashcards = document.getElementById("flashcards");
    const reading = document.getElementById("reading");

    const htmlFiles = files.filter(f => f.name.endsWith(".html"));

    const chapterOrder = [
        "Chapter1_Ultimate_Study_Guide.html",
        "Chapter2_Ultimate_Study_Guide.html",
        "Chapter2_Ultimate_Study_Guide_with_Flashcards.html",
        "Chapter3_Ultimate_Study_Guide.html",
        "Chapter4_Ultimate_Study_Guide.html",
        "Chapter5_Ultimate_Study_Guide.html"
    ];

    htmlFiles.forEach(file => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = file.name;
        a.textContent = file.name.replace(/_/g, " ").replace(".html", "");
        li.appendChild(a);

        if (chapterOrder.includes(file.name)) {
            chapters.appendChild(li);
        } else if (file.name.includes("Flashcards")) {
            flashcards.appendChild(li);
        } else if (file.name.includes("Reading")) {
            reading.appendChild(li);
        } else {
            nonchapters.appendChild(li);
        }
    });

    document.getElementById("loading").style.display = "none";
}

loadFiles();

/* Search filter */
document.getElementById("searchBox").addEventListener("input", function() {
    const query = this.value.toLowerCase();
    const links = document.querySelectorAll("li");

    links.forEach(li => {
        const text = li.textContent.toLowerCase();
        li.style.display = text.includes(query) ? "" : "none";
    });
});
</script>

</body>
</html>
